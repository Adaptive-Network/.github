name: Build, Unit Test and Integration Test .NET Project
on:
  workflow_call:
    inputs:
        USER_NAME:
            description: 'Username for private NuGet feed'
            required: true
            type: string
        ARTIFACT_RETENTION_DAYS:
            description: 'Number of days to retain build artifacts'
            required: false
            type: number
            default: 1
        WORKING_DIRECTORY:
            description: 'Working directory for the build process'
            required: false
            type: string
            default: '/'
        DOTNET_VERSION:
            description: 'List of .NET versions to build against'
            required: true
            type: string
        SOLUTION_RELATIVE_PATH:
            description: 'The relative path of the solution'
            required: true
            type: string
jobs:
    build:
      uses: adaptive-network/.github/.github/workflows/build_dotnet.yml@release
      with:
        USER_NAME: ${{ inputs.USER_NAME }}
        ARTIFACT_RETENTION_DAYS: ${{ inputs.ARTIFACT_RETENTION_DAYS }}
        WORKING_DIRECTORY: ${{ inputs.WORKING_DIRECTORY }}
        DOTNET_VERSION: ${{ inputs.DOTNET_VERSION }}
        SOLUTION_RELATIVE_PATH: ${{inputs.SOLUTION_RELATIVE_PATH}}
      secrets: inherit
    unit_tests:
        uses: adaptive-network/.github/.github/workflows/unit_test_dotnet.yml@release
        needs: build
        with:
          USER_NAME: ${{ inputs.USER_NAME }}
          ARTIFACT_RETENTION_DAYS: ${{ inputs.ARTIFACT_RETENTION_DAYS }}
          WORKING_DIRECTORY: ${{ inputs.WORKING_DIRECTORY }}
          DOTNET_VERSION: ${{ inputs.DOTNET_VERSION }}
          SOLUTION_RELATIVE_PATH: ${{inputs.SOLUTION_RELATIVE_PATH}}
        secrets: inherit
    integration_tests:
        uses: adaptive-network/.github/.github/workflows/integration_test_dotnet.yml@release
        needs: build
        with:
          USER_NAME: ${{ inputs.USER_NAME }}
          ARTIFACT_RETENTION_DAYS: ${{ inputs.ARTIFACT_RETENTION_DAYS }}
          WORKING_DIRECTORY: ${{ inputs.WORKING_DIRECTORY }}
          DOTNET_VERSION: ${{ inputs.DOTNET_VERSION }}
          SOLUTION_RELATIVE_PATH: ${{inputs.SOLUTION_RELATIVE_PATH}}
        secrets: inherit
